<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roundtable Podcast Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f0f0f;
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }

        .main-wrapper {
            max-width: 1400px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 1fr 400px;
            gap: 20px;
            align-items: start;
        }

        .container {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            width: 100%;
            padding: 48px;
        }

        .sidebar {
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 12px;
            padding: 24px;
            position: sticky;
            top: 20px;
            max-height: calc(100vh - 40px);
            overflow-y: auto;
        }

        .sidebar h2 {
            color: #ffffff;
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            letter-spacing: -0.025em;
        }

        .transcript {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .transcript-line {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .speaker {
            font-weight: 600;
            font-size: 0.875rem;
            color: #7da3cc;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .speaker.alex {
            color: #7da3cc;
        }

        .speaker.jamie {
            color: #cc9d7d;
        }

        .dialogue {
            color: #d0d0d0;
            font-size: 0.9375rem;
            line-height: 1.6;
        }

        .transcript-empty {
            color: #606060;
            font-size: 0.9375rem;
            text-align: center;
            padding: 40px 20px;
        }

        .header {
            margin-bottom: 40px;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 8px;
            font-size: 1.875rem;
            font-weight: 600;
            letter-spacing: -0.025em;
        }

        .subtitle {
            color: #a0a0a0;
            font-size: 1rem;
            font-weight: 400;
        }

        .input-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #d0d0d0;
            font-weight: 500;
            font-size: 0.9375rem;
        }

        textarea {
            width: 100%;
            padding: 14px 16px;
            background: #0f0f0f;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            font-size: 15px;
            color: #e0e0e0;
            transition: all 0.2s ease;
            font-family: inherit;
            min-height: 140px;
            resize: vertical;
            line-height: 1.5;
        }

        textarea::placeholder {
            color: #606060;
        }

        textarea:focus {
            outline: none;
            border-color: #404040;
            background: #141414;
        }

        .example-topics {
            margin-top: 12px;
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }

        .example-topics span {
            display: inline-block;
            background: #252525;
            color: #b0b0b0;
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8125rem;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid transparent;
        }

        .example-topics span:hover {
            background: #2a2a2a;
            color: #e0e0e0;
            border-color: #3a3a3a;
        }

        button {
            width: 100%;
            padding: 14px 24px;
            background: #ffffff;
            color: #0f0f0f;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            letter-spacing: -0.01em;
        }

        button:hover:not(:disabled) {
            background: #f0f0f0;
            transform: translateY(-1px);
        }

        button:active:not(:disabled) {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .status {
            margin-top: 24px;
            padding: 14px 16px;
            border-radius: 8px;
            display: none;
            font-size: 0.9375rem;
            line-height: 1.5;
        }

        .status.loading {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #1a2332;
            color: #7da3cc;
            border: 1px solid #2a3a4a;
        }

        .status.error {
            display: block;
            background: #2a1a1a;
            color: #e89090;
            border: 1px solid #3a2525;
        }

        .status.success {
            display: block;
            background: #1a2a1f;
            color: #90d0a0;
            border: 1px solid #253a2a;
        }

        .audio-player {
            margin-top: 32px;
            padding: 24px;
            background: #141414;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            display: none;
        }

        .audio-player.show {
            display: block;
        }

        .audio-player h3 {
            color: #ffffff;
            margin-bottom: 16px;
            font-size: 1.125rem;
            font-weight: 600;
        }

        audio {
            width: 100%;
            margin-bottom: 16px;
            border-radius: 8px;
        }

        .download-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #252525;
            color: #e0e0e0;
            padding: 10px 18px;
            text-decoration: none;
            border-radius: 6px;
            font-weight: 500;
            font-size: 0.9375rem;
            transition: all 0.2s ease;
            border: 1px solid #2a2a2a;
        }

        .download-btn:hover {
            background: #2a2a2a;
            border-color: #3a3a3a;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(125, 163, 204, 0.3);
            border-radius: 50%;
            border-top-color: #7da3cc;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        /* Custom scrollbar for sidebar */
        .sidebar::-webkit-scrollbar {
            width: 8px;
        }

        .sidebar::-webkit-scrollbar-track {
            background: #1a1a1a;
        }

        .sidebar::-webkit-scrollbar-thumb {
            background: #2a2a2a;
            border-radius: 4px;
        }

        .sidebar::-webkit-scrollbar-thumb:hover {
            background: #3a3a3a;
        }

        @media (max-width: 1024px) {
            .main-wrapper {
                grid-template-columns: 1fr;
            }

            .sidebar {
                position: relative;
                top: 0;
                max-height: 600px;
            }
        }

        @media (max-width: 640px) {
            .container {
                padding: 32px 24px;
            }

            .sidebar {
                padding: 20px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .subtitle {
                font-size: 0.9375rem;
            }
        }
    </style>
</head>
<body>
    <div class="main-wrapper">
        <div class="container">
            <div class="header">
                <h1>The AI Roundtable</h1>
                <p class="subtitle">Generate conversational podcasts on any topic. </p>
            </div>

            <form id="podcastForm">
                <div class="input-group">
                    <label for="topic">Topic for Alex and Jamie to discuss: </label>
                    <textarea 
                        id="topic" 
                        name="topic" 
                        placeholder="Enter any topic you'd like to explore..."
                        required
                    ></textarea>
                    <div class="example-topics">
                        <span onclick="setTopic('The history of the internet')">History of the internet</span>
                        <span onclick="setTopic('How black holes work')">Black holes</span>
                        <span onclick="setTopic('The benefits of meditation')">Meditation benefits</span>
                    </div>
                </div>

                <button type="submit" id="generateBtn">
                    Create Podcast
                </button>
            </form>

            <div id="status" class="status"></div>

            <div id="audioPlayer" class="audio-player">
                <h3>Ready to listen</h3>
                <audio id="audio" controls></audio>
                <a id="downloadBtn" class="download-btn" download="podcast.mp3">
                    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M8 11L4 7H6.5V2H9.5V7H12L8 11Z" fill="currentColor"/>
                        <path d="M2 13H14V14H2V13Z" fill="currentColor"/>
                    </svg>
                    Download
                </a>
            </div>
        </div>

        <div class="sidebar" id="transcriptSidebar">
            <h2>Transcript</h2>
            <div id="transcriptContent" class="transcript">
                <div class="transcript-empty">Generate a podcast to see the transcript here</div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('podcastForm');
        const topicInput = document.getElementById('topic');
        const generateBtn = document.getElementById('generateBtn');
        const statusDiv = document.getElementById('status');
        const audioPlayer = document.getElementById('audioPlayer');
        const audioElement = document.getElementById('audio');
        const downloadBtn = document.getElementById('downloadBtn');
        const transcriptSidebar = document.getElementById('transcriptSidebar');
        const transcriptContent = document.getElementById('transcriptContent');

        // Configure your worker URL here
        const WORKER_URL = 'https://aipodcast-worker.eliperez0024.workers.dev'; // Change this to your deployed worker URL

        function setTopic(topic) {
            topicInput.value = topic;
        }

        function showStatus(message, type) {
            statusDiv.textContent = message;
            statusDiv.className = `status ${type}`;
        }

        function hideStatus() {
            statusDiv.className = 'status';
        }

        function parseTranscript(scriptText) {
            // Parse the script format: [Alex]:text\n[Jamie]:text
            const lines = scriptText.split('\n').filter(line => line.trim());
            const transcript = [];
            
            for (const line of lines) {
                const match = line.match(/\[(Alex|Jamie)\]:(.*)/);
                if (match) {
                    transcript.push({
                        speaker: match[1],
                        text: match[2].trim()
                    });
                }
            }
            
            return transcript;
        }

        function displayTranscript(transcript) {
            transcriptContent.innerHTML = '';
            
            transcript.forEach(line => {
                const lineDiv = document.createElement('div');
                lineDiv.className = 'transcript-line';
                
                const speakerDiv = document.createElement('div');
                speakerDiv.className = `speaker ${line.speaker.toLowerCase()}`;
                speakerDiv.textContent = line.speaker;
                
                const dialogueDiv = document.createElement('div');
                dialogueDiv.className = 'dialogue';
                dialogueDiv.textContent = line.text;
                
                lineDiv.appendChild(speakerDiv);
                lineDiv.appendChild(dialogueDiv);
                transcriptContent.appendChild(lineDiv);
            });
        }

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const topic = topicInput.value.trim();
            if (!topic) {
                showStatus('Please enter a topic', 'error');
                return;
            }

            // Hide previous audio player and reset transcript
            audioPlayer.classList.remove('show');
            transcriptContent.innerHTML = '<div class="transcript-empty">Generating transcript...</div>';
            
            // Show loading state
            generateBtn.disabled = true;
            generateBtn.innerHTML = '<span class="spinner"></span> Creating podcast...';
            showStatus('Generating conversation... this typically takes 30-60 seconds', 'loading');

            try {
                // First, fetch the transcript
                showStatus('Generating script...', 'loading');
                const transcriptResponse = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ topic, transcript: true })
                });

                if (!transcriptResponse.ok) {
                    throw new Error(`Server error: ${transcriptResponse.status}`);
                }

                const transcriptData = await transcriptResponse.json();
                const transcript = parseTranscript(transcriptData.transcript);
                displayTranscript(transcript);

                // Then, fetch the audio using the same script
                showStatus('Generating audio... this may take 30-60 seconds', 'loading');
                const audioResponse = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ topic, script: transcriptData.transcript })
                });

                if (!audioResponse.ok) {
                    throw new Error(`Server error: ${audioResponse.status}`);
                }

                // Get the audio blob
                const audioBlob = await audioResponse.blob();
                
                // Create a URL for the audio blob
                const audioUrl = URL.createObjectURL(audioBlob);
                
                // Set up audio player
                audioElement.src = audioUrl;
                downloadBtn.href = audioUrl;
                downloadBtn.download = `podcast-${Date.now()}.mp3`;
                
                // Show success
                showStatus('Podcast created successfully', 'success');
                audioPlayer.classList.add('show');
                
            } catch (error) {
                console.error('Error:', error);
                showStatus(`Error: ${error.message}. Please check your connection and try again.`, 'error');
            } finally {
                // Reset button
                generateBtn.disabled = false;
                generateBtn.textContent = 'Create Podcast';
            }
        });

        // Auto-hide success message after 3 seconds
        const observer = new MutationObserver(() => {
            if (statusDiv.classList.contains('success')) {
                setTimeout(() => {
                    if (statusDiv.classList.contains('success')) {
                        hideStatus();
                    }
                }, 3000);
            }
        });
        observer.observe(statusDiv, { attributes: true, attributeFilter: ['class'] });
    </script>
</body>
</html>
