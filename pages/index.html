<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The AI Roundtable</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-wrapper">
        <div class="container">
            <div class="header">
                <h1>The AI Roundtable</h1>
                <p class="subtitle">Generate conversational podcasts on any topic. </p>
            </div> 



            <form id="podcastForm">
                <div class="input-group">
                    <label>Topic</label>
                    <textarea 
                        id="topic" 
                        name="topic" 
                        placeholder="Enter any topic you'd like Alex and Jamie to explore, or submit text you'd like them to deep dive into..."
                        required
                    ></textarea>
                    <div class="example-topics">
                        <span onclick="setTopic('How black holes work.')">Black holes</span>
                        <span onclick="setTopic('The entire history of the universe.')">Universe History</span>
                        <span onclick="setTopic(`Analyze this poem by Dylan Thomas:

Do not go gentle into that good night,
Old age should burn and rave at close of day;
Rage, rage against the dying of the light.

Though wise men at their end know dark is right,
Because their words had forked no lightning they
Do not go gentle into that good night.

Good men, the last wave by, crying how bright
Their frail deeds might have danced in a green bay,
Rage, rage against the dying of the light.

Wild men who caught and sang the sun in flight,
And learn, too late, they grieved it on its way,
Do not go gentle into that good night.

Grave men, near death, who see with blinding sight
Blind eyes could blaze like meteors and be gay,
Rage, rage against the dying of the light.

And you, my father, there on the sad height,
Curse, bless, me now with your fierce tears, I pray.
Do not go gentle into that good night.
Rage, rage against the dying of the light.`
                        )"> Analyze Poem</span>
                        <span onclick="setTopic('How Cloudflare workers, work.')">Cloudflare Workers</span>
                    </div>
                </div>

                <div class="style-selector">
                    <label>Podcast Style</label>
                    <div class="style-options">
                        <button type="button" class="style-option active" data-style="brief">
                            <!-- <div class="style-icon">⚡</div> -->
                            <div class="style-name">Brief Talk</div>
                            <div class="style-desc">3-5 min • Quick overview</div>
                        </button>
                        <button type="button" class="style-option" data-style="deep">
                            <!-- <div class="style-icon">🎙️</div> -->
                            <div class="style-name">Deep Dive</div>
                            <div class="style-desc">~10 min • In-depth discussion</div>
                        </button>
                    </div>
                </div>

                <div class="voice-selector">
                    <label>Host Voices</label>
                    <div class="voice-dropdowns">
                        <div class="voice-group">
                            <label for="alexVoice">Alex's Voice</label>
                            <select id="alexVoice" name="alexVoice" class="voice-dropdown">
                                <option value="arcas" selected>Arcas (Default)</option>
                                <option value="amalthea">Amalthea</option>
                                <option value="andromeda">Andromeda</option>
                                <option value="apollo">Apollo</option>
                                <option value="aries">Aries</option>
                                <option value="asteria">Asteria</option>
                                <option value="athena">Athena</option>
                                <option value="atlas">Atlas</option>
                                <option value="aurora">Aurora</option>
                                <option value="callista">Callista</option>
                                <option value="cora">Cora</option>
                                <option value="cordelia">Cordelia</option>
                                <option value="delia">Delia</option>
                                <option value="draco">Draco</option>
                                <option value="electra">Electra</option>
                                <option value="harmonia">Harmonia</option>
                                <option value="helena">Helena</option>
                                <option value="hera">Hera</option>
                                <option value="hyperion">Hyperion</option>
                                <option value="iris">Iris</option>
                                <option value="janus">Janus</option>
                                <option value="juno">Juno</option>
                                <option value="jupiter">Jupiter</option>
                                <option value="luna">Luna</option>
                                <option value="mars">Mars</option>
                                <option value="minerva">Minerva</option>
                                <option value="neptune">Neptune</option>
                                <option value="odysseus">Odysseus</option>
                                <option value="ophelia">Ophelia</option>
                                <option value="orion">Orion</option>
                                <option value="orpheus">Orpheus</option>
                                <option value="pandora">Pandora</option>
                                <option value="phoebe">Phoebe</option>
                                <option value="pluto">Pluto</option>
                                <option value="saturn">Saturn</option>
                                <option value="thalia">Thalia</option>
                                <option value="theia">Theia</option>
                                <option value="vesta">Vesta</option>
                                <option value="zeus">Zeus</option>
                            </select>
                        </div>
                        <div class="voice-group">
                            <label for="jamieVoice">Jamie's Voice</label>
                            <select id="jamieVoice" name="jamieVoice" class="voice-dropdown">
                                <option value="harmonia" selected>Harmonia (Default)</option>
                                <option value="amalthea">Amalthea</option>
                                <option value="andromeda">Andromeda</option>
                                <option value="apollo">Apollo</option>
                                <option value="arcas">Arcas</option>
                                <option value="aries">Aries</option>
                                <option value="asteria">Asteria</option>
                                <option value="athena">Athena</option>
                                <option value="atlas">Atlas</option>
                                <option value="aurora">Aurora</option>
                                <option value="callista">Callista</option>
                                <option value="cora">Cora</option>
                                <option value="cordelia">Cordelia</option>
                                <option value="delia">Delia</option>
                                <option value="draco">Draco</option>
                                <option value="electra">Electra</option>
                                <option value="harmonia">Harmonia</option>
                                <option value="helena">Helena</option>
                                <option value="hera">Hera</option>
                                <option value="hyperion">Hyperion</option>
                                <option value="iris">Iris</option>
                                <option value="janus">Janus</option>
                                <option value="juno">Juno</option>
                                <option value="jupiter">Jupiter</option>
                                <option value="luna">Luna</option>
                                <option value="mars">Mars</option>
                                <option value="minerva">Minerva</option>
                                <option value="neptune">Neptune</option>
                                <option value="odysseus">Odysseus</option>
                                <option value="ophelia">Ophelia</option>
                                <option value="orion">Orion</option>
                                <option value="orpheus">Orpheus</option>
                                <option value="pandora">Pandora</option>
                                <option value="phoebe">Phoebe</option>
                                <option value="pluto">Pluto</option>
                                <option value="saturn">Saturn</option>
                                <option value="thalia">Thalia</option>
                                <option value="theia">Theia</option>
                                <option value="vesta">Vesta</option>
                                <option value="zeus">Zeus</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div id="audioPlayer" class="audio-player">
                <h3>Ready to listen</h3>
                <audio id="audio" controls></audio>
                <div class="download-buttons">
                    <a id="downloadBtn" class="download-btn" download="podcast.mp3">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 11L4 7H6.5V2H9.5V7H12L8 11Z" fill="currentColor"/>
                            <path d="M2 13H14V14H2V13Z" fill="currentColor"/>
                        </svg>
                        Download MP3
                    </a>
                    <a id="downloadTranscriptBtn" class="download-btn download-transcript-btn">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 11L4 7H6.5V2H9.5V7H12L8 11Z" fill="currentColor"/>
                            <path d="M2 13H14V14H2V13Z" fill="currentColor"/>
                        </svg>
                        Download Transcript
                    </a>
                </div>
            
            </div>

                <button type="submit" id="generateBtn">
                    Create Podcast
                </button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <button type="button" id="headlinesBtn" class="headlines-btn">
                Generate Podcast from Today's Top Stories
            </button>

            
        </div>

        <div class="sidebar" id="transcriptSidebar">
            <h2>Transcript</h2>
            <div id="transcriptContent" class="transcript">
                <div class="transcript-empty">Generate a podcast to see the transcript here</div>
            </div>
        </div>
    </div>

    <div id="status" class="status"></div>

    <script src="app.js"></script>
</body>
</html>
