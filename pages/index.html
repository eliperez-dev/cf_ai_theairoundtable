<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The AI Roundtable</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="main-wrapper">
        <div class="container">
            <div class="header">
                <h1>The AI Roundtable</h1>
                <p class="subtitle">Generate conversational podcasts on any topic. </p>
            </div> 



            <form id="podcastForm">
                <div class="input-group">
                    <label>Topic</label>
                    <textarea 
                        id="topic" 
                        name="topic" 
                        placeholder="Enter any topic you'd like Alex and Jamie to explore, or submit text you'd like them to deep dive into..."
                        required
                    ></textarea>
                    <div class="example-topics">
                        <span onclick="setTopic('The history of the internet.')">History of the internet</span>
                        <span onclick="setTopic('How black holes work.')">Black holes</span>
                        <span onclick="setTopic('The benefits of meditation.')">Meditation benefits</span>
                        <span onclick="setTopic('How Cloudflare workers, work.')">Cloudflare Workers</span>
                    </div>
                </div>

                <div class="style-selector">
                    <label>Podcast Style</label>
                    <div class="style-options">
                        <button type="button" class="style-option active" data-style="brief">
                            <!-- <div class="style-icon">⚡</div> -->
                            <div class="style-name">Brief Talk</div>
                            <div class="style-desc">3-5 min • Quick overview</div>
                        </button>
                        <button type="button" class="style-option" data-style="deep">
                            <!-- <div class="style-icon">🎙️</div> -->
                            <div class="style-name">Deep Dive</div>
                            <div class="style-desc">~10 min • In-depth discussion</div>
                        </button>
                    </div>
                </div>

                <div id="audioPlayer" class="audio-player">
                <h3>Ready to listen</h3>
                <audio id="audio" controls></audio>
                <div class="download-buttons">
                    <a id="downloadBtn" class="download-btn" download="podcast.mp3">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 11L4 7H6.5V2H9.5V7H12L8 11Z" fill="currentColor"/>
                            <path d="M2 13H14V14H2V13Z" fill="currentColor"/>
                        </svg>
                        Download MP3
                    </a>
                    <a id="downloadTranscriptBtn" class="download-btn download-transcript-btn">
                        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <path d="M8 11L4 7H6.5V2H9.5V7H12L8 11Z" fill="currentColor"/>
                            <path d="M2 13H14V14H2V13Z" fill="currentColor"/>
                        </svg>
                        Download Transcript
                    </a>
                </div>
            
            </div>

                <button type="submit" id="generateBtn">
                    Create Podcast
                </button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <button type="button" id="headlinesBtn" class="headlines-btn">
                Generate Podcast from Today's Top Stories
            </button>

            
        </div>

        <div class="sidebar" id="transcriptSidebar">
            <h2>Transcript</h2>
            <div id="transcriptContent" class="transcript">
                <div class="transcript-empty">Generate a podcast to see the transcript here</div>
            </div>
        </div>
    </div>

    <div id="status" class="status"></div>

    <script src="app.js"></script>
</body>
</html>
